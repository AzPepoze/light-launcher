appId: com.azpepoze.lightlauncher
productName: LightLauncher
directories:
  output: dist/bundle
  buildResources: build
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/shared/**/*
  - from: src/renderer/dist
    to: dist/renderer
  - package.json
linux:
  extraResources:
    - from: bin/light-launcher-instance
      to: light-launcher-instance
  target:
    - target: AppImage
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  category: Game
  desktop:
    StartupWMClass: light-launcher
    Name: LightLauncher
    Comment: Ultra-lightweight Linux gaming launcher
win:
  extraResources:
    - from: bin/light-launcher-instance.exe
      to: light-launcher-instance.exe
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
