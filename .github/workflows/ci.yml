name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: go test ./...

      - name: Logger tests
        working-directory: shell/logx
        run: go test ./...

  bun:
    name: bun checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:ui

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:ui

  shell-gtk:
    name: gtk shell (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 and WebKitGTK 6.0
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev xvfb

      - uses: actions/setup-go@v5
        with:
          go-version-file: shell/gtk/go.mod
          cache-dependency-path: shell/gtk/go.mod

      - name: Vet
        working-directory: shell/gtk
        run: go vet ./...

      - name: Test
        working-directory: shell/gtk
        run: go test ./...

      - name: Build
        working-directory: shell/gtk
        run: go build -ldflags="-s -w" -o "$RUNNER_TEMP/light-launcher-shell" .

  shell-webview2:
    name: webview2 shell (cross build)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: shell/webview2/go.mod
          cache-dependency-path: shell/webview2/go.sum

      # Compile check only. The shell has not been run on Windows yet.
      - name: Vet
        working-directory: shell/webview2
        env:
          GOOS: windows
          GOARCH: amd64
        run: go vet ./...

      - name: Build
        working-directory: shell/webview2
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags="-s -w -H=windowsgui" -o "$RUNNER_TEMP/light-launcher-shell.exe" .

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 "$RUNNER_TEMP"

      - name: Run actionlint
        run: $RUNNER_TEMP/actionlint -color
