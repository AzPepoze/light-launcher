name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build only. Do not publish a GitHub Release."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build release files
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      # Electron is not used any more. Skip its large binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      # fetch-depth 0 and tags make git describe return the release version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: oven-sh/setup-bun@v2

      - name: Install Qt6 WebEngine and NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-webengine-dev zip nsis

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux files
        run: bash scripts/build-linux.sh

      - name: Build Windows files
        run: bash scripts/build-windows.sh

      - name: Check release files
        run: |
          shopt -s nullglob
          archives=(dist/*.tar.gz dist/*.zip dist/*-setup.exe)
          if (( ${#archives[@]} != 3 )); then
            echo "::error::expected 3 release files, found ${#archives[@]}"
            exit 1
          fi
          test -f dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS

  publish:
    name: publish release
    needs: [build]
    if: github.event_name == 'push' || inputs.dry-run == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
